document.getElementById('copy-image-btn').addEventListener('click', () => {
  document.getElementById('encode-canvas').toBlob(async blob => {
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      showToast('تصویر در کلیپ‌بورد کپی شد.', 'success');
    }catch(e){
      showToast('کپی در این مرورگر پشتیبانی نمی‌شود.', 'error');
    }
  });
});
document.getElementById('share-btn').addEventListener('click', async () => {
  const canvas = document.getElementById('encode-canvas');
  if(!navigator.share){ showToast('اشتراک‌گذاری در این مرورگر پشتیبانی نمی‌شود.', 'error'); return; }
  canvas.toBlob(async blob => {
    const file = new File([blob], 'zetcode.png', {type:'image/png'});
    try {
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'ZetCode', text:'کد ZetCode'});
      } else {
        await navigator.share({title:'ZetCode', text:'کد ZetCode'});
      }
    } catch(e){}
  });
});
document.getElementById('print-btn').addEventListener('click', () => {
  const dataUrl = document.getElementById('encode-canvas').toDataURL('image/png');
  const win = window.open('', '_blank');
  if(!win){ showToast('پنجره‌ی چاپ مسدود شد.', 'error'); return; }
  win.document.write(`<img src="${dataUrl}" style="width:100%" onload="window.print()">`);
});

/* ===================== HISTORY ===================== */

const HISTORY_KEY = 'zetcode-history-v2';
function loadHistory(){
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function persistHistory(items){
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 30))); } catch(e){}
}
function saveHistory(entry){
  const items = loadHistory();
  items.unshift(entry);
  persistHistory(items);
  renderHistory();
}
function renderHistory(){
  const items = loadHistory();
  const list = document.getElementById('history-list');
  const empty = document.getElementById('history-empty');
  list.innerHTML = '';
  if(!items.length){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  const frag = document.createDocumentFragment();
  items.forEach((it, idx) => {
    const el = document.createElement('div');
    el.className = 'history-item';
    const badges = [];
    if(it.flags & FLAG_COMPRESS) badges.push('فشرده');
    if(it.flags & FLAG_ENCRYPT) badges.push('رمز');
    if(it.ecLevel > 0) badges.push('EC:' + EC_NAMES[it.ecLevel]);
    const date = new Date(it.ts).toLocaleString('fa-IR', {dateStyle:'short', timeStyle:'short'});
    el.innerHTML = `
      <span class="history-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5 3.5 7.3v9.4L12 21.5l8.5-4.8V7.3z"/>
          <path d="M12 21.5v-9.4"/>
        </svg>
      </span>
      <div class="history-body">
        <div class="history-text"></div>
        <div class="history-meta">
          <span>${toPersianDigits(it.textLen)} کاراکتر</span>
          <span>${toPersianDigits(it.cells.toLocaleString('en-US'))} سلول</span>
          <span>${toPersianDigits(it.size)}px</span>
          ${badges.length ? '<span>'+badges.join(' + ')+'</span>' : ''}
          <span>${date}</span>
        </div>
      </div>
      <div class="history-actions">
        <button class="mini-btn" data-act="reuse" title="بازاستفاده">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8.5"/>
            <path d="M21 3.5v5h-5"/>
          </svg>
        </button>
        <button class="mini-btn" data-act="del" title="حذف">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>
    `;
    el.querySelector('.history-text').textContent = it.text.replace(/\s+/g,' ').slice(0, 80);
    el.querySelector('[data-act="reuse"]').addEventListener('click', e => {
      e.stopPropagation();
      textInput.value = it.text;
      updateCounters();
      document.querySelector('[data-tab="encode"]').click();
      textInput.focus();
      showToast('متن در ویرایشگر بارگذاری شد.', 'success');
    });
    el.querySelector('[data-act="del"]').addEventListener('click', e => {
      e.stopPropagation();
      const items = loadHistory();
      items.splice(idx, 1);
      persistHistory(items);
      renderHistory();
    });
    frag.appendChild(el);
  });
  list.appendChild(frag);
}
document.getElementById('clear-history-btn').addEventListener('click', () => {
  if(confirm('تاریخچه پاک شود؟')){
    persistHistory([]);
    renderHistory();
  }
});
renderHistory();

/* ===================== DECODE UI ===================== */

const decodeCanvas = document.getElementById('decode-canvas');
const decodeCtx = decodeCanvas.getContext('2d');
const loupe = document.getElementById('loupe');
const loupeCtx = loupe.getContext('2d');

let baseCanvas = null;
let baseImageData = null;
let decodeState = {stage:'idle', corners:[], detected:null};
let pendingPt = null;

const CORNER_NAMES = ['بالا‌چپ', 'بالا‌راست', 'پایین‌راست', 'پایین‌چپ'];

function showControls(manual){
  document.getElementById('decode-controls').style.display = 'flex';
  document.getElementById('manual-mode-btn').style.display = manual ? 'none' : 'inline-flex';
  document.getElementById('undo-point-btn').style.display = manual ? 'inline-flex' : 'none';
  document.getElementById('reset-calibration-btn').style.display = manual ? 'inline-flex' : 'none';
}
function resetResultUI(){
  document.getElementById('decode-progress-wrap').style.display = 'none';
  document.getElementById('decode-progress-label').style.display = 'none';
  document.getElementById('decode-progress-fill').style.width = '0%';
  document.getElementById('result-text').style.display = 'none';
  document.getElementById('result-actions').style.display = 'none';
}
function setProgress(done, total){
  document.getElementById('decode-progress-wrap').style.display = 'block';
  const label = document.getElementById('decode-progress-label');
  label.style.display = 'block';
  document.getElementById('decode-progress-fill').style.width = Math.round(done/total*100) + '%';
  label.textContent = `${toPersianDigits(done.toLocaleString('en-US'))} از ${toPersianDigits(total.toLocaleString('en-US'))} سلول خوانده شد`;
}
async function showResult(res){
  const flags = res.flags || 0;

  // رمزنگاری
  if(flags & FLAG_ENCRYPT){
    const pw = prompt('این کد رمزنگاری شده است. رمز عبور را وارد کنید:');
    if(!pw){ setStatus('decode-status', 'رمز عبور وارد نشد.', 'error'); return; }
    try {
      const recovered = await recoverPayload(res.payload, flags, pw);
      const text = new TextDecoder('utf-8', {fatal:false}).decode(recovered);
      const resultEl = document.getElementById('result-text');
      resultEl.value = text;
      resultEl.style.display = 'block';
      document.getElementById('result-actions').style.display = 'flex';
      setStatus('decode-status', `متن رمزگشایی شد (${toPersianDigits(res.cells.toLocaleString('en-US'))} سلول)`, 'success');
      showToast('متن با موفقیت رمزگشایی شد', 'success');
    } catch(e){
      setStatus('decode-status', e.message, 'error');
    }
    return;
  }

  // بدون رمزنگاری
  let finalPayload = res.payload;
  if(flags & FLAG_COMPRESS){
    try {
      finalPayload = await recoverPayload(res.payload, flags, null);
    } catch(e){
      setStatus('decode-status', 'خطا در بازکردن فشرده‌سازی: ' + e.message, 'error');
      return;
    }
  }

  const text = new TextDecoder('utf-8', {fatal:false}).decode(finalPayload);
  const resultEl = document.getElementById('result-text');
  resultEl.value = text;
  resultEl.style.display = 'block';
  document.getElementById('result-actions').style.display = 'flex';

  if(res.rsFailed){
    setStatus('decode-status', 'هشدار: تصحیح خطا ناموفق بود؛ متن ممکن است ناقص باشد.', 'error');
    showToast('تصحیح خطا ناموفق', 'error');
    return;
  }

  if(res.crcOk){
    const badges = [];
    if(flags & FLAG_COMPRESS) badges.push('فشرده');
    if(res.ecLevel > 0) badges.push('EC:' + EC_NAMES[res.ecLevel]);
    const badgeStr = badges.length ? ` [${badges.join(' + ')}]` : '';
    let extra = '';
    if(res.corrected > 0) extra = ` — ${toPersianDigits(res.corrected)} خطا تصحیح شد`;
    setStatus('decode-status', `متن با موفقیت بازخوانی شد${badgeStr}${extra} (${toPersianDigits(res.cells.toLocaleString('en-US'))} سلول، چگالی ${toPersianDigits(res.density)} بیت)`, 'success');
    showToast('متن با موفقیت بازخوانی شد', 'success');
  } else {
    const hint = res.ppu < 4 ? ' وضوح تصویر پایین است.' : '';
    setStatus('decode-status', 'هشدار: کد پیدا شد اما بررسی CRC ناموفق بود؛ ممکن است چند سلول اشتباه خوانده شده باشد.' + hint, 'error');
  }
}
function drawDetection(ctx, scale, detected){
  if(!detected) return;
  ctx.lineWidth = 2*scale;
  (detected.finders || []).forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, 3.5*f.m, 0, Math.PI*2);
    ctx.strokeStyle = '#10B981';
    ctx.stroke();
  });
  if(detected.corners){
    ctx.beginPath();
    detected.corners.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.strokeStyle = 'rgba(34,211,238,.95)';
    ctx.stroke();
  }
}
function loadImageToDecodeCanvas(imgEl){
  const maxSide = 7000;
  const scale = Math.min(1, maxSide / Math.max(imgEl.naturalWidth, imgEl.naturalHeight));
  const w = Math.round(imgEl.naturalWidth * scale), h = Math.round(imgEl.naturalHeight * scale);
  baseCanvas = document.createElement('canvas');
  baseCanvas.width = w; baseCanvas.height = h;
  const bctx = baseCanvas.getContext('2d', {willReadFrequently:true});
  bctx.drawImage(imgEl, 0, 0, w, h);
  baseImageData = bctx.getImageData(0, 0, w, h);
  decodeCanvas.width = w; decodeCanvas.height = h;
  document.getElementById('decode-canvas-wrap').style.display = 'flex';
  runAutoScan();
}
async function runAutoScan(){
  decodeState = {stage:'auto', corners:[], detected:null};
  resetResultUI();
  document.getElementById('corner-instructions').style.display = 'none';
  document.getElementById('decode-controls').style.display = 'none';
  redrawDecode();
  setStatus('decode-status', 'در حال تشخیص خودکار کد...', 'info');
  await nextFrame();
  try{
    const r = await scanImage(baseImageData, setProgress);
    decodeState.detected = {finders: r.finders, corners: r.corners};
    redrawDecode();
    if(r.ok){
      await showResult(r.res);
      decodeState.stage = 'done';
      if(!r.res.crcOk || r.res.rsFailed) showControls(false);
    }else{
      resetResultUI();
      const msg = r.reason === 'finders' || r.reason === 'quad'
        ? 'چهار الگوی گوشه‌ی کد در تصویر پیدا نشد.'
        : 'الگوهای گوشه پیدا شد اما محتوای کد خوانده نشد.';
      setStatus('decode-status', msg, 'error');
      showControls(false);
    }
  }catch(err){
    resetResultUI();
    setStatus('decode-status', 'خطا: ' + err.message, 'error');
    showControls(false);
  }
}
function updateInstructions(){
  const n = decodeState.corners.length;
  const box = document.getElementById('corner-instructions');
  box.style.display = 'block';
  box.textContent = n < 4
    ? `نقطه‌ی ${toPersianDigits(n+1)} از ۴ — مرکز الگوی گوشه‌ی «${CORNER_NAMES[n]}» را مشخص کنید.`
    : 'در حال خواندن...';
}
function startManual(){
  decodeState = {stage:'awaiting-corners', corners:[], detected:null};
  resetResultUI();
  clearStatus('decode-status');
  showControls(true);
  redrawDecode();
  updateInstructions();
}
function redrawDecode(){
  if(!baseCanvas) return;
  decodeCtx.drawImage(baseCanvas, 0, 0);
  const rect = decodeCanvas.getBoundingClientRect();
  const k = rect.width ? decodeCanvas.width / rect.width : 1;
  drawDetection(decodeCtx, k, decodeState.detected);
  decodeState.corners.forEach((p,i) => {
    decodeCtx.beginPath();
    decodeCtx.arc(p.x, p.y, 5*k, 0, Math.PI*2);
    decodeCtx.fillStyle = '#6D6AF7';
    decodeCtx.fill();
    decodeCtx.strokeStyle = '#fff';
    decodeCtx.lineWidth = 1.5*k;
    decodeCtx.stroke();
    decodeCtx.fillStyle = '#fff';
    decodeCtx.font = `${13*k}px sans-serif`;
    decodeCtx.fillText(String(i+1), p.x + 8*k, p.y - 8*k);
  });
}
function eventToImagePoint(ev){
  const rect = decodeCanvas.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left) * decodeCanvas.width / rect.width,
    y: (ev.clientY - rect.top) * decodeCanvas.height / rect.height
  };
}
function showLoupe(ev, pt){
  const R = 16;
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, 132, 132);
  loupeCtx.drawImage(baseCanvas, pt.x - R, pt.y - R, 2*R, 2*R, 0, 0, 132, 132);
  loupeCtx.strokeStyle = '#ff2d55';
  loupeCtx.lineWidth = 1;
  loupeCtx.beginPath();
  loupeCtx.moveTo(66, 0); loupeCtx.lineTo(66, 132);
  loupeCtx.moveTo(0, 66); loupeCtx.lineTo(132, 66);
  loupeCtx.stroke();
  const left = Math.max(4, Math.min(window.innerWidth - 136, ev.clientX - 66));
  let top = ev.clientY - 170;
  if(top < 4) top = ev.clientY + 50;
  loupe.style.left = left + 'px';
  loupe.style.top = top + 'px';
  loupe.style.display = 'block';
}
decodeCanvas.addEventListener('pointerdown', ev => {
  if(decodeState.stage !== 'awaiting-corners') return;
  ev.preventDefault();
  decodeCanvas.setPointerCapture(ev.pointerId);
  pendingPt = eventToImagePoint(ev);
  showLoupe(ev, pendingPt);
});
decodeCanvas.addEventListener('pointermove', ev => {
  if(!pendingPt) return;
  pendingPt = eventToImagePoint(ev);
  showLoupe(ev, pendingPt);
});
decodeCanvas.addEventListener('pointerup', ev => {
  if(!pendingPt) return;
  const pt = eventToImagePoint(ev);
  pendingPt = null;
  loupe.style.display = 'none';
  if(decodeState.stage !== 'awaiting-corners') return;
  decodeState.corners.push(pt);
  redrawDecode();
  updateInstructions();
  if(decodeState.corners.length === 4) runManualDecode();
});
decodeCanvas.addEventListener('pointercancel', () => { pendingPt = null; loupe.style.display = 'none'; });

document.getElementById('manual-mode-btn').addEventListener('click', () => { if(baseCanvas) startManual(); });
document.getElementById('undo-point-btn').addEventListener('click', () => {
  if(decodeState.stage === 'awaiting-corners' && decodeState.corners.length){
    decodeState.corners.pop();
    redrawDecode();
    updateInstructions();
  }
});
document.getElementById('reset-calibration-btn').addEventListener('click', () => { if(baseCanvas) startManual(); });

async function runManualDecode(){
  decodeState.stage = 'decoding';
  setStatus('decode-status', 'در حال خواندن کد...', 'info');
  await nextFrame();
  try{
    const res = await decodeFromCorners(baseImageData, decodeState.corners, setProgress);
    if(!res.ok){
      setStatus('decode-status', res.error, 'error');
      startManualKeepStatus();
      return;
    }
    await showResult(res);
    decodeState.stage = 'done';
  }catch(err){
    setStatus('decode-status', 'خطا: ' + err.message, 'error');
    startManualKeepStatus();
  }
}
function startManualKeepStatus(){
  decodeState = {stage:'awaiting-corners', corners:[], detected:null};
  showControls(true);
  redrawDecode();
  updateInstructions();
}

/* ===================== LIVE CAMERA ===================== */

const video = document.getElementById('camera-video');
const overlay = document.getElementById('scan-overlay');
const frameCanvas = document.createElement('canvas');
const frameCtx = frameCanvas.getContext('2d', {willReadFrequently:true});
let cameraStream = null;
let cameraTrack = null;
const live = {on:false, timer:null, attempts:0, best:null};

function stopLive(showBest){
  live.on = false;
  clearTimeout(live.timer);
  if(cameraStream){ cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  cameraTrack = null;
  video.srcObject = null;
  document.getElementById('video-wrap').style.display = 'none';
  document.getElementById('stop-scan-btn').style.display = 'none';
  document.getElementById('camera-controls').style.display = 'none';
  document.getElementById('torch-btn').style.display = 'none';
  document.getElementById('zoom-in-btn').style.display = 'none';
  document.getElementById('zoom-out-btn').style.display = 'none';
  if(showBest && live.best){ resetResultUI(); showResult(live.best); }
  live.best = null;
}
function drawOverlay(r, w, h){
  overlay.width = w; overlay.height = h;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawDetection(ctx, Math.max(1, w/700), {finders: r.finders, corners: r.corners});
}
async function liveLoop(){
  if(!live.on) return;
  if(video.readyState < 2 || !video.videoWidth){ live.timer = setTimeout(liveLoop, 200); return; }
  live.attempts++;
  frameCanvas.width = video.videoWidth; frameCanvas.height = video.videoHeight;
  frameCtx.drawImage(video, 0, 0);
  const img = frameCtx.getImageData(0, 0, frameCanvas.width, frameCanvas.height);
  let r;
  try{ r = await scanImage(img); }catch(e){ r = {ok:false, finders:[]}; }
  if(!live.on) return;
  drawOverlay(r, img.width, img.height);
  if(r.ok && r.res.crcOk && !r.res.rsFailed){
    stopLive(false);
    resetResultUI();
    await showResult(r.res);
    return;
  }
  if(r.ok) live.best = r.res;
  const nf = (r.finders || []).length;
  setStatus('decode-status',
    r.ok ? 'کد پیدا شد ولی خواندن ناقص است؛ دوربین را ثابت و صاف نگه دارید...'
         : nf >= 4 ? 'الگوهای گوشه پیدا شد، در حال خواندن...'
                   : 'در حال جستجوی کد... هر چهار گوشه‌ی کد باید در کادر باشد.',
    'info');
  live.timer = setTimeout(liveLoop, 80);
}
document.getElementById('activate-camera-btn').addEventListener('click', async () => {
  if(live.on) return;
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:3840}, height:{ideal:2160}}
    });
  }catch(err){
    showToast('دسترسی به دوربین ممکن نشد: ' + err.message, 'error');
    return;
  }
  document.getElementById('decode-canvas-wrap').style.display = 'none';
  document.getElementById('corner-instructions').style.display = 'none';
  document.getElementById('decode-controls').style.display = 'none';
  resetResultUI();
  baseCanvas = null;
  video.srcObject = cameraStream;
  await video.play().catch(() => {});
  document.getElementById('video-wrap').style.display = 'block';
  document.getElementById('stop-scan-btn').style.display = 'inline-flex';

  cameraTrack = cameraStream.getVideoTracks()[0];
  const caps = cameraTrack.getCapabilities ? cameraTrack.getCapabilities() : {};
  const ctrls = document.getElementById('camera-controls');
  ctrls.style.display = 'flex';
  if(caps.torch) document.getElementById('torch-btn').style.display = 'grid';
  if(caps.zoom){
    document.getElementById('zoom-in-btn').style.display = 'grid';
    document.getElementById('zoom-out-btn').style.display = 'grid';
  }

  live.on = true; live.attempts = 0; live.best = null;
  setStatus('decode-status', 'در حال جستجوی کد...', 'info');
  liveLoop();
});
document.getElementById('stop-scan-btn').addEventListener('click', () => {
  const had = !!live.best;
  stopLive(true);
  if(!had) clearStatus('decode-status');
});
document.getElementById('torch-btn').addEventListener('click', async () => {
  if(!cameraTrack) return;
  const btn = document.getElementById('torch-btn');
  const on = !btn.classList.contains('on');
  try {
    await cameraTrack.applyConstraints({advanced:[{torch:on}]});
    btn.classList.toggle('on', on);
  } catch(e){ showToast('کنترل چراغ قوه ممکن نشد.', 'error'); }
});
let currentZoom = 1;
document.getElementById('zoom-in-btn').addEventListener('click', async () => {
  if(!cameraTrack) return;
  const caps = cameraTrack.getCapabilities ? cameraTrack.getCapabilities() : {};
  if(!caps.zoom) return;
  currentZoom = Math.min(caps.zoom.max, currentZoom * 1.4);
  try { await cameraTrack.applyConstraints({advanced:[{zoom:currentZoom}]}); } catch(e){}
});
document.getElementById('zoom-out-btn').addEventListener('click', async () => {
  if(!cameraTrack) return;
  const caps = cameraTrack.getCapabilities ? cameraTrack.getCapabilities() : {};
  if(!caps.zoom) return;
  currentZoom = Math.max(caps.zoom.min, currentZoom / 1.4);
  try { await cameraTrack.applyConstraints({advanced:[{zoom:currentZoom}]}); } catch(e){}
});

/* ===================== UPLOAD / PASTE / DROP ===================== */

document.getElementById('upload-image-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', ev => {
  const file = ev.target.files[0];
  if(!file) return;
  handleImageFile(file);
  ev.target.value = '';
});
function handleImageFile(file){
  if(!file.type.startsWith('image/')){
    showToast('فقط فایل تصویری پذیرفته می‌شود.', 'error');
    return;
  }
  stopLive(false);
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { loadImageToDecodeCanvas(img); URL.revokeObjectURL(url); };
  img.onerror = () => showToast('این فایل به‌عنوان تصویر خوانده نشد.', 'error');
  img.src = url;
}

const dropZone = document.getElementById('drop-zone');
['dragenter','dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('over'); });
});
['dragleave','drop'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('over'); });
});
dropZone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if(file) handleImageFile(file);
});
document.getElementById('decode-panel').addEventListener('dragover', e => e.preventDefault());
document.getElementById('decode-panel').addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(file) handleImageFile(file);
});

document.addEventListener('paste', e => {
  const decodeActive = document.getElementById('decode-panel').classList.contains('active');
  if(!decodeActive) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.startsWith('image/')){
      const file = it.getAsFile();
      if(file){ handleImageFile(file); e.preventDefault(); return; }
    }
  }
});

/* ===================== RESULT ACTIONS ===================== */

document.getElementById('copy-text-btn').addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(document.getElementById('result-text').value);
    showToast('متن کپی شد.', 'success');
  }catch(e){ showToast('کپی ممکن نشد.', 'error'); }
});
document.getElementById('download-text-btn').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('result-text').value], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'zetcode-decoded.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

/* ===================== TABS ===================== */

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-panel').classList.add('active');
    if(btn.dataset.tab !== 'decode') stopLive(false);
  });
});

/* ===================== PWA ===================== */

(function setupPWA(){
  try {
    const manifest = {
      name:'ZetCode',
      short_name:'ZetCode',
      description:'کدگذاری نوری متن',
      start_url: location.href,
      display:'standalone',
      background_color:'#08090D',
      theme_color:'#6D6AF7',
      lang:'fa',
      dir:'rtl',
      icons:[{
        src:'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D6AF7"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="512" height="512" rx="96" fill="#08090D"/><polygon points="256,96 416,192 416,320 256,416 96,320 96,192" fill="url(#g)"/></svg>'),
        sizes:'512x512',
        type:'image/svg+xml',
        purpose:'any maskable'
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    if('serviceWorker' in navigator && location.protocol !== 'file:'){
      const swCode = `
        const CACHE = 'zetcode-v2';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {
          if(e.request.method !== 'GET') return;
          e.respondWith(
            caches.open(CACHE).then(c =>
              c.match(e.request).then(r => r || fetch(e.request).then(res => {
                if(res && res.status === 200 && res.type === 'basic') c.put(e.request, res.clone());
                return res;
              }).catch(() => c.match(e.request)))
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  } catch(e){}

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwa-install-btn').style.display = 'grid';
  });
  document.getElementById('pwa-install-btn').addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('pwa-install-btn').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('pwa-install-btn').style.display = 'none';
    showToast('ZetCode نصب شد.', 'success');
  });
})();

  cellSizeInput.disabled = true;
  autoMinCheckbox.checked = true;
  passwordRow.style.display = 'none';
  updateCounters();
})();
